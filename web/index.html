<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calorie Scale</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Calorie Scale</h1>
      <button id="settingsBtn" class="ghost" title="Settings">Settings</button>
    </header>

    <!-- Settings -->
    <section id="settingsPanel" class="card settings hidden">
      <h2>Setup</h2>
      <label>
        ESP32-CAM address
        <input id="espIp" type="text" placeholder="e.g. 192.168.1.42 (from Serial Monitor)" />
      </label>
      <label>
        Gemini API key
        <input id="apiKey" type="password" placeholder="Get one free at aistudio.google.com/apikey" />
      </label>
      <label>
        Gemini model
        <input id="model" type="text" value="gemini-2.5-flash" />
      </label>
      <label class="row">
        <input id="useFlash" type="checkbox" />
        Use camera flash LED when taking the photo
      </label>
      <button id="saveSettings" class="primary">Save</button>
      <p id="settingsStatus" class="muted"></p>
    </section>

    <!-- Live weight -->
    <section class="card scale-card">
      <div class="weight-wrap">
        <div id="weight" class="weight">--</div>
        <div class="unit">grams</div>
      </div>
      <div class="scale-actions">
        <button id="tareBtn" class="ghost">Tare (zero)</button>
        <span id="connStatus" class="conn offline">offline</span>
      </div>
    </section>

    <!-- Analyze -->
    <section class="card analyze-card">
      <button id="analyzeBtn" class="primary big">Identify food &amp; count calories</button>
      <button id="previewBtn" class="ghost">Preview photo</button>
      <div id="analyzeStatus" class="muted"></div>

      <div id="photoWrap" class="photo-wrap hidden">
        <img id="photo" alt="Food on the scale" />
      </div>

      <div id="result" class="result hidden">
        <div class="result-info">
          <div id="foodName" class="food-name"></div>
          <div class="result-grid">
            <div><span class="muted">Weight</span><strong id="rWeight"></strong></div>
            <div><span class="muted">Calories / 100 g</span><strong id="rPer100"></strong></div>
            <div><span class="muted">Confidence</span><strong id="rConf"></strong></div>
          </div>
          <div class="total">
            <span>Total</span>
            <strong id="rTotal"></strong>
          </div>
          <button id="addBtn" class="primary">Add to session log</button>
        </div>
      </div>
    </section>

    <!-- Session log -->
    <section class="card log-card">
      <div class="log-header">
        <h2>Session log</h2>
        <div class="session-total">Total: <strong id="sessionTotal">0</strong> kcal</div>
      </div>
      <ul id="log" class="log"></ul>
      <button id="clearLog" class="ghost small">Clear log</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
